<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PortaLink</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background-color: #111;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 15px 30px rgba(0, 255, 136, 0.1);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 2.5rem;
      color: #00ff88;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    h2 {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 30px;
    }

    input {
      width: 90%;
      padding: 14px;
      margin-bottom: 20px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      background-color: #1a1a1a;
      color: #fff;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #00ff88;
      box-shadow: 0 0 5px #00ff88;
    }

    button {
      background-color: #00ff88;
      color: #000;
      padding: 14px;
      width: 100%;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #00e67a;
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1>PortaLink</h1>
    <h2>Bem-vindo ao sistema de portaria</h2>

    <input type="text" id="nome" placeholder="Digite seu nome" required>
    <input type="text" id="matricula" placeholder="Digite sua matrícula" required>

    <button onclick="entrarSistema()">Entrar</button>
  </div>

  <script>
    function entrarSistema() {
      const nome = document.getElementById("nome").value.trim();
      const matricula = document.getElementById("matricula").value.trim();

      if (!nome || !matricula) {
        alert("Por favor, preencha todos os campos.");
        return;
      }

      localStorage.setItem("nomePorteiro", nome);
      localStorage.setItem("matriculaPorteiro", matricula);

      window.location.href = "dashboard.html";
    }
  </script>

</body>
</html>
